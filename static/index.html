<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qoneqt Video Factory</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23141414%27/%3E%3Cpath d=%27M12 9l10 7-10 7z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --panel:#F7F7F7; --border:#E3E3E3; --border-2:#CFCFCF;
  --fg:#141414; --fg-2:#5C5C5C; --fg-3:#8A8A8A;
  --amber:#B45309; --amber-bg:#FFF7ED; --green:#15803D; --green-bg:#F0FDF4; --red:#B91C1C; --red-bg:#FEF2F2;
  --font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:6px; --r-lg:8px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:var(--r)}
a{color:var(--fg)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

/* app bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:52px;padding:0 24px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none}
.brand .mark{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#8B5CF6,#EC4899);flex:none}
.top nav{display:flex;align-items:center;gap:18px;color:var(--fg-2);font-size:13px}
.top nav a{color:var(--fg);text-decoration:none;font-weight:500;padding:6px 10px;border:1px solid var(--border-2);border-radius:var(--r)}
.top nav a:hover{background:var(--panel)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--fg-3);margin-right:7px;vertical-align:1px}
.dot.on{background:var(--amber)}

/* layout */
.layout{display:grid;grid-template-columns:360px 1fr;min-height:calc(100vh - 52px)}
.new{padding:24px;border-right:1px solid var(--border);background:var(--panel)}
.videos{padding:24px 28px 64px;min-width:0}

/* form */
.new h1{font-size:18px;margin-bottom:18px}
.field{display:block;margin-bottom:16px}
.field > span{display:block;font-weight:500;font-size:13px;margin-bottom:6px}
.field small{display:block;color:var(--fg-2);font-weight:400;margin-top:-4px;margin-bottom:6px}
.topics{width:100%;min-height:104px;resize:vertical;padding:9px 10px;background:#fff;border:1px solid var(--border-2);border-radius:var(--r);line-height:1.45}
.topics::placeholder{color:var(--fg-3)}
.topics:focus,.sel:focus{outline:none;border-color:var(--fg);box-shadow:0 0 0 2px rgba(20,20,20,.12)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-6px 0 14px}
.hint{color:var(--fg-2);font-size:13px;margin:0}
.btn{padding:6px 11px;border:1px solid var(--border-2);border-radius:var(--r);background:#fff;font-weight:500;font-size:13px;line-height:1.3}
.btn:hover{border-color:var(--fg)}
.btn:disabled{color:var(--fg-3);border-color:var(--border);cursor:default}
.ideas{list-style:none;margin:0 0 16px;padding:0;border:1px solid var(--border);border-radius:var(--r);background:#fff;overflow:hidden}
.ideas:empty{display:none}
.ideas li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-top:1px solid var(--border);font-size:13px}
.ideas li:first-child{border-top:0}
.ideas li button{flex:none;padding:3px 9px;font-size:12px}
.sel{width:100%;appearance:none;-webkit-appearance:none;padding:8px 32px 8px 10px;background:#fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%2712%27 viewBox=%270 0 12 12%27%3E%3Cpath d=%27M2.5 4.5l3.5 3.5 3.5-3.5%27 fill=%27none%27 stroke=%27%23141414%27 stroke-width=%271.5%27/%3E%3C/svg%3E") no-repeat right 10px center;border:1px solid var(--border-2);border-radius:var(--r)}
.seg{display:flex;border:1px solid var(--border-2);border-radius:var(--r);background:#fff;overflow:hidden}
.seg label{flex:1;position:relative;text-align:center;border-left:1px solid var(--border);font-size:13px}
.seg label:first-child{border-left:0}
.seg input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.seg span{display:block;padding:7px 0}
.seg input:checked+span{background:var(--fg);color:#fff;font-weight:500}
.seg input:focus-visible+span{outline:2px solid var(--fg);outline-offset:-2px}
.primary{width:100%;padding:10px 14px;border:1px solid var(--fg);border-radius:var(--r);background:var(--fg);color:#fff;font-weight:500;font-size:14px;margin-top:4px}
.primary:hover{background:#000}
.primary:disabled{background:var(--border);border-color:var(--border);color:var(--fg-3);cursor:default}
.after{margin-top:10px}
kbd{font:inherit;font-size:12px;border:1px solid var(--border-2);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff}

/* videos */
.sec{margin-bottom:36px}
.sec-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.sec-head h2{font-size:15px}
.sec-head span{color:var(--fg-2);font-size:13px}
.empty{border:1px dashed var(--border-2);border-radius:var(--r-lg);padding:36px 20px;text-align:center;color:var(--fg-2)}
.empty b{display:block;color:var(--fg);font-weight:500;margin-bottom:2px}
.item{display:grid;grid-template-columns:72px minmax(0,1fr);gap:18px;padding:16px 0;border-top:1px solid var(--border)}
.item:last-child{border-bottom:1px solid var(--border)}
.thumb{position:relative;width:72px;aspect-ratio:9/16;border-radius:var(--r);background:#EDEDED;overflow:hidden;border:1px solid var(--border)}
.thumb .fill{position:absolute;left:0;right:0;bottom:0;height:var(--fill,0%);background:#D4D4D4;transition:height .8s ease}
.thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.ready .thumb{width:168px;border:0;border-radius:var(--r-lg)}
.ready{grid-template-columns:168px minmax(0,1fr)}
.item h3{font-size:15px;line-height:1.35}
.meta{margin:3px 0 0;color:var(--fg-2);font-size:13px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:1px}
.status::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.status.making{color:var(--amber);background:var(--amber-bg)}
.status.queued{color:var(--fg-2);background:#F0F0F0}
.status.failed{color:var(--red);background:var(--red-bg)}
.status.ready{color:var(--green);background:var(--green-bg)}
.prog{height:4px;background:#E6E6E6;border-radius:2px;overflow:hidden;margin:12px 0 6px;max-width:420px}
.prog i{display:block;height:100%;width:var(--w,0%);background:var(--fg);transition:width .8s ease}
.step{margin:0;font-size:13px;color:var(--fg-2)}
.err{margin:10px 0 0;font-size:13px;color:var(--red)}
.post{margin:12px 0 0;white-space:pre-wrap;font:inherit;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;max-width:62ch;line-height:1.5}
.post .tags{color:var(--fg-2)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;max-width:62ch}
.actions a{text-decoration:none}
.danger{margin-left:auto;background:none;border:0;padding:6px 0;color:var(--red);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.danger:disabled{color:var(--fg-3);text-decoration:none;cursor:wait}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(8px);opacity:0;background:var(--fg);color:#fff;padding:8px 14px;border-radius:var(--r);font-size:13px;font-weight:500;transition:opacity .2s,transform .2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .new{border-right:0;border-bottom:1px solid var(--border)}
  .videos{padding:20px 16px 56px}
  .top{padding:0 16px}
  .top nav span{display:none}
}
@media (max-width:520px){
  .ready{grid-template-columns:1fr}
  .ready .thumb{width:min(200px,60vw)}
}
@media (prefers-reduced-motion:reduce){.thumb .fill,.prog i,.toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>Qoneqt Video Factory</a>
  <nav><span id="tally"><i class="dot" aria-hidden="true"></i>Idle</span><a href="https://qoneqt.com/networks/global-feed" target="_blank" rel="noopener">Open Global Feed</a></nav>
</header>

<main class="layout">
  <form id="intake" class="new" aria-labelledby="new-title">
    <h1 id="new-title">New video</h1>

    <label class="field" for="topics"><span>Topics</span><small>One per line. Each line becomes a video.</small>
      <textarea id="topics" class="topics" rows="4" placeholder="why sleep matters&#10;5 AI tools every student should know&#10;chai vs coffee"></textarea>
    </label>
    <div class="row">
      <button type="button" class="btn" id="suggest">Suggest topics</button>
      <p class="hint" id="suggest-status">Uses what India is searching today.</p>
    </div>
    <ul class="ideas" id="ideas"></ul>

    <label class="field"><span>Community</span><select class="sel" name="community" id="community"></select></label>
    <label class="field"><span>Language</span><select class="sel" name="language" id="language"></select></label>
    <div class="field"><span>Length</span><div class="seg" id="durations"></div></div>

    <button type="submit" class="primary" id="start" disabled>Make video</button>
    <p class="hint after" id="intake-status"><kbd>Ctrl</kbd> <kbd>Enter</kbd> also starts it. About a minute per video.</p>
  </form>

  <section class="videos">
    <div class="sec" id="making-sec" hidden>
      <div class="sec-head"><h2>In progress</h2><span id="making-count"></span></div>
      <div id="making" aria-live="polite"></div>
    </div>
    <div class="sec" id="ready-sec" hidden>
      <div class="sec-head"><h2>Ready to post</h2><span id="ready-count"></span></div>
      <div id="ready"></div>
    </div>
    <div class="empty" id="empty"><b>No videos yet</b>Add a topic on the left and make one. It appears here while it is being made.</div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const STAGES = ["plan", "images", "voice", "visuals", "captions", "render"];
const LABEL = {general: "General", tech: "Tech & AI", fitness: "Fitness", motivation: "Motivation", finance: "Finance", hinglish_fun: "Hinglish Fun"};
const posts = {};
let timer = null, labels = {}, makingKey = "", readyKey = "";

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c])); }
function lines() { return $("#topics").value.split("\n").map(s => s.trim()).filter(Boolean).slice(0, 10); }
function label(slug) { return labels[slug] || LABEL[slug] || slug; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

fetch("/presets").then(r => r.json()).then(p => {
  p.communities.forEach(x => labels[x.slug] = LABEL[x.slug] || x.label);
  p.languages.forEach(x => labels[x.slug] = x.label);
  $("#community").innerHTML = p.communities.map(x => `<option value="${x.slug}" data-language="${x.language}">${esc(label(x.slug))}</option>`).join("");
  $("#language").innerHTML = p.languages.map(x => `<option value="${x.slug}"${x.slug === "en" ? " selected" : ""}>${esc(x.label)}</option>`).join("");
  $("#durations").innerHTML = p.durations.map(d => `<label><input type="radio" name="duration" value="${d}"${d === 30 ? " checked" : ""}><span>${d} s</span></label>`).join("");
});

// a community with a non-English default (Hinglish Fun) switches the language; any change drops stale ideas
$("#community").addEventListener("change", e => {
  const l = e.target.selectedOptions[0].dataset.language;
  if (l && l !== "en") $("#language").value = l;
  $("#ideas").innerHTML = "";
});
$("#language").addEventListener("change", () => { $("#ideas").innerHTML = ""; });

$("#suggest").onclick = async () => {
  const b = $("#suggest"), st = $("#suggest-status");
  b.disabled = true; b.textContent = "Thinking…"; st.textContent = "";
  try {
    const r = await fetch(`/suggest?community=${encodeURIComponent($("#community").value)}&language=${encodeURIComponent($("#language").value)}`);
    if (!r.ok) throw new Error(await r.text());
    const s = await r.json();
    $("#ideas").innerHTML = s.topics.map(t => `<li><span>${esc(t)}</span><button type="button" class="btn" data-idea="${esc(t)}">Add</button></li>`).join("");
    st.textContent = s.trends.length ? `${s.topics.length} ideas, some from today's Google Trends India.` : `${s.topics.length} ideas.`;
  } catch (_) { st.textContent = "Suggestions are unavailable right now. Type a topic instead."; }
  b.disabled = false; b.textContent = "Suggest topics";
};

$("#topics").addEventListener("input", () => {
  const n = lines().length, b = $("#start");
  b.disabled = n === 0;
  b.textContent = n <= 1 ? "Make video" : `Make ${n} videos`;
});
$("#topics").addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key === "Enter") $("#intake").requestSubmit(); });

$("#intake").onsubmit = async e => {
  e.preventDefault();
  const topics = lines();
  if (!topics.length) return;
  const fd = new FormData(e.target);
  const body = {topics, community: fd.get("community") || "general", language: fd.get("language") || "en", duration: +fd.get("duration") || 30};
  $("#start").disabled = true;
  const r = await fetch("/generate", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) { $("#intake-status").textContent = "Could not start: " + (await r.text()); $("#start").disabled = false; return; }
  toast(topics.length === 1 ? "Making 1 video" : `Making ${topics.length} videos`);
  $("#topics").value = "";
  $("#start").textContent = "Make video";
  poll();
};

document.addEventListener("click", async e => {
  const idea = e.target.closest("button[data-idea]");
  if (idea) {
    const cur = lines();
    if (!cur.includes(idea.dataset.idea)) { $("#topics").value = [...cur, idea.dataset.idea].join("\n"); $("#topics").dispatchEvent(new Event("input")); }
    idea.disabled = true; idea.textContent = "Added";
    return;
  }
  const copy = e.target.closest("button[data-copy]");
  if (copy) { await navigator.clipboard.writeText(posts[copy.dataset.copy]); toast("Post text copied"); return; }
  const del = e.target.closest("button[data-del]");
  if (del) {
    if (!confirm(`Delete "${del.dataset.topic}"? The video and its post text are removed from the server.`)) return;
    del.disabled = true; del.textContent = "Deleting";
    const r = await fetch(`/jobs/${del.dataset.del}`, {method: "DELETE"});
    if (!r.ok) { del.disabled = false; del.textContent = "Delete failed, try again"; return; }
    toast("Video deleted");
    poll();
    return;
  }
  const retry = e.target.closest("button[data-retry]");
  if (retry) {
    retry.disabled = true;
    await fetch("/generate", {method: "POST", headers: {"Content-Type": "application/json"}, body: retry.dataset.retry});
    poll();
  }
});

async function poll() {
  clearTimeout(timer);
  let jobs = [];
  try { jobs = await (await fetch("/jobs")).json(); } catch (_) { timer = setTimeout(poll, 4000); return; }
  render(jobs);
  // fast while something is being made, slow otherwise so jobs started from another tab or the API still show up
  timer = setTimeout(poll, jobs.some(j => j.status === "queued" || j.status === "running") ? 2000 : 8000);
}

function opts(j) { return `${esc(label(j.community))}, ${esc(label(j.language))}, ${j.duration} s`; }

function makingItem(j) {
  const idx = STAGES.indexOf(j.stage);
  if (j.status === "failed") {
    const at = (j.error || "").split(":")[0] || "an unknown step", why = (j.error || "").split(":").slice(1).join(":").trim() || "Something went wrong.";
    return `<article class="item"><div class="thumb"></div><div>
      <h3>${esc(j.topic)}<span class="status failed">Failed</span></h3>
      <p class="meta">${opts(j)}. Stopped at ${esc(at)}.</p>
      <p class="err">${esc(why)}</p>
      <div class="actions"><button type="button" class="btn" data-retry='${esc(JSON.stringify({topics: [j.topic], community: j.community, language: j.language, duration: j.duration}))}'>Try again</button></div>
    </div></article>`;
  }
  const running = j.status === "running", pct = running ? Math.round(((idx + 0.5) / STAGES.length) * 100) : 0;
  return `<article class="item"><div class="thumb"><div class="fill" style="--fill:${pct}%"></div></div><div>
    <h3>${esc(j.topic)}<span class="status ${running ? "making" : "queued"}">${running ? "Making" : "Queued"}</span></h3>
    <p class="meta">${opts(j)}</p>
    <div class="prog"><i style="--w:${pct}%"></i></div>
    <p class="step">${running ? `${cap(j.stage)}, step ${idx + 1} of ${STAGES.length}` : "Waiting for the previous video to finish"}</p>
  </div></article>`;
}

function readyItem(j) {
  const m = j.result;
  posts[j.id] = `${m.hook}\n\n${m.caption}\n\n${m.hashtags.join(" ")}`;
  const voice = {elevenlabs: "ElevenLabs", edge: "Microsoft", gemini: "Gemini"}[m.scenes[0].voice] || m.scenes[0].voice;
  return `<article class="item ready">
    <div class="thumb"><video controls playsinline preload="metadata" poster="${m.thumb}" src="${m.video}"></video></div>
    <div>
      <h3>${esc(j.topic)}<span class="status ready">Ready</span></h3>
      <p class="meta">${opts(j)}. ${Math.round(m.duration)} s of speech, made in ${Math.round(m.seconds_to_make)} s, ${esc(voice)} voice.</p>
      <pre class="post">${esc(m.hook)}\n\n${esc(m.caption)}\n\n<span class="tags">${esc(m.hashtags.join(" "))}</span></pre>
      <div class="actions">
        <button type="button" class="btn" data-copy="${j.id}">Copy post text</button>
        <a class="btn" href="${m.video}" download="${esc(j.topic).replace(/[^a-z0-9]+/gi, "-").toLowerCase()}.mp4">Download MP4</a>
        <button type="button" class="danger" data-del="${j.id}" data-topic="${esc(j.topic)}">Delete</button>
      </div>
    </div>
  </article>`;
}

function render(jobs) {
  const making = jobs.filter(j => j.status !== "done").sort((a, b) => a.created - b.created);  // the line runs oldest first
  const ready = jobs.filter(j => j.status === "done");
  const live = making.filter(j => j.status !== "failed").length;
  $("#tally").innerHTML = `<i class="dot${live ? " on" : ""}" aria-hidden="true"></i>${live ? `${live} in progress` : "Idle"}${ready.length ? `, ${ready.length} ready` : ""}`;
  $("#empty").hidden = jobs.length > 0;

  // repaint a section only when it changed: a repaint restarts transitions and any playing video
  const mk = JSON.stringify(making.map(j => [j.id, j.status, j.stage, j.error]));
  $("#making-sec").hidden = making.length === 0;
  if (mk !== makingKey) { $("#making").innerHTML = making.map(makingItem).join(""); $("#making-count").textContent = making.length; }
  makingKey = mk;

  const rk = ready.map(j => j.id).join();
  $("#ready-sec").hidden = ready.length === 0;
  if (rk !== readyKey) { $("#ready").innerHTML = ready.map(readyItem).join(""); $("#ready-count").textContent = ready.length; }
  readyKey = rk;
}
poll();
</script>
</body>
</html>
